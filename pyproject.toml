[project]
name = "data-splitting-ingestion"
version = "0.1.0"
description = "Guideline PDF-to-Markdown cleaning, chunking, indexing, and MCP retrieval pipeline."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "requests>=2.31",
    "pdfplumber>=0.11",
    "scrapling[fetchers]>=0.4.9,<0.5",
    "pymupdf>=1.24",
    "psycopg[binary]>=3.2",
    # psycopg-pool 提供 ConnectionPool, 替代"每次请求都 connect()" 的高频建连开销。
    # 版本与 psycopg v3 主版本号保持一致 (>=3.2)。
    "psycopg-pool>=3.2",
    "mcp>=1.9",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src"]

[tool.ruff.lint]
# Keep Ruff as a lightweight syntax/name safety gate for the active pipeline.
select = ["E9", "F63", "F7", "F82"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
check_untyped_defs = false
disallow_untyped_defs = false
no_implicit_optional = true

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = true
